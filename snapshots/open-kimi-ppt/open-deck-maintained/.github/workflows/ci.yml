name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only Python dependencies
        run: python -m pip install --disable-pip-version-check pyyaml pillow websocket-client
      - name: Run Node and Python tests
        run: npm test

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify published file set
        run: npm pack --dry-run
      - name: Build package tarball
        run: npm pack
      - name: Smoke-test the installed package CLI
        shell: bash
        run: |
          prefix="$(mktemp -d)"
          npm install --global --prefix "$prefix" ./open-deck-skill-*.tgz
          "$prefix/bin/open-deck-skill" --version
          "$prefix/bin/open-deck-skill" serve --help
          "$prefix/bin/open-deck-skill" install --target "$prefix/skills"
          test -f "$prefix/skills/open-kimi-ppt/SKILL.md"
